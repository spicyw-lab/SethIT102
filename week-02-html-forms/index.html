<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Customer Food Order Form</title>
</head>

<body>

    <h1>Customer Food Order Form</h1>

    <p>Please complete the form below to submit your food preference.</p>

    
    <h2>Customer Name:</h2>

    <form action="#" method="post">

        <label for="firstName">First:</label>
        <input type="text" id="firstName" name="firstName" minlength="2" maxlength="20" required>

        <br>
        <br>

        <label for="lastName">Last:</label>
        <input type="text" id="lastName" name="lastName" minlength="2" maxlength="20" required>

        <br>
        <br>

        <label for="foodChoice">Food Preference (Meat only, No Vegetarian Options):</label>
        <select id="foodChoice" name="foodChoice" required>
            <option value="">-- Select a food option --</option>
            <option value="chicken">Chicken</option>
            <option value="beef">Beef</option>
            <option value="fish">Fish</option>
        </select>

        <br>
        <br>
        
        <label for="allergies">Please list any allergies:</label>
        <br>
        <textarea id="allergies" name="allergies" rows="5" cols="40"
            placeholder="List any food allergies here. If none, leave blank."></textarea>
        <p>Need allergy information? Visit <a href="https://www.foodallergy.org" target="_blank">Food Allergy Research and
            Education</a>.
        </p>
        <br>
        <br>

        <button type="submit">Submit Your Order</button>

    </form>
</body>

</html>
