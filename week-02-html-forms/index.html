<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Customer Food Order Form</title>
</head>

<body>

    <h1>Customer Food Order Form</h1>

    <p>Please complete the form below to submit your food preference.</p>
    <p>Need allergy information? Visit <a href="https://www.foodallergy.org" target="_blank">Food Allergy Research and
            Education</a>.</p>

    <form action="#" method="post">

        <label for="firstName">First Name:</label>
        <input type="text" id="firstName" name="firstName" minlength="2" maxlength="30" required>

        <br>
        <br>

        <label for="lastName">Last Name:</label>
        <input type="text" id="lastName" name="lastName" minlength="2" maxlength="30" required>

        <br>
        <br>

        <label for="foodChoice">Food Preference:</label>
        <select id="foodChoice" name="foodChoice" required>
            <option value="">-- Select a food option --</option>
            <option value="chicken">Chicken</option>
            <option value="beef">Beef</option>
            <option value="fish">Fish</option>
        </select>

        <br>
        <br>

        <label for="allergies">Allergy Information:</label>
        <br>
        <textarea id="allergies" name="allergies" rows="5" cols="40"
            placeholder="List any allergies here. If none, leave blank."></textarea>

        <br>
        <br>

        <button type="submit">Send Order</button>

    </form>
</body>

</html>
